<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CITEMAS 3D Logo</title>
<script>
  if (/[?&]embed/.test(location.search)) {
    document.documentElement.classList.add('embed');
  }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  html.embed, html.embed body, body.embed{background:transparent !important}
  body{background:radial-gradient(ellipse at 50% 45%,#2a0d10,#060506 72%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body.embed{background:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
  canvas:active{cursor:grabbing}
  #hint,#dl{position:fixed;bottom:14px;font-size:12px;color:#ffffffaa}
  #hint{left:50%;transform:translateX(-50%);pointer-events:none}
  #dl{right:14px;background:#ffffff14;border:1px solid #ffffff33;border-radius:999px;padding:6px 14px;cursor:pointer;color:#fff;font:inherit;font-size:12px}
  #dl:focus-visible{outline:2px solid #ff4a52;outline-offset:2px}
  #exp{position:fixed;top:14px;left:14px;background:#dc2626;color:#fff;border-radius:999px;padding:8px 18px;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;box-shadow:0 4px 16px rgba(220,38,38,0.5);transition:transform 0.2s}
  #exp:hover{transform:scale(1.05);background:#ef4444}
  body.embed #hint,body.embed #dl,body.embed #exp{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<a id="exp" href="/experience">✨ Enter 3D Cinematic Showcase &rarr;</a>
<div id="hint">Drag to rotate</div>
<button id="dl" type="button">Download .glb</button>

<!--
  EMBED ON YOUR LANDING PAGE:
  <iframe src="citemas-logo-3d.html?embed" style="width:100%;height:480px;border:0" title="CITEMAS logo"></iframe>
  "?embed" gives a transparent background and hides the hint and download button.
-->
<script src="/js/three.min.js"></script>
<script src="/js/GLTFExporter.js"></script>
<script>
(function(){
const stage=document.getElementById('stage'),dl=document.getElementById('dl');
if(!window.THREE){stage.textContent='Could not load three.js. Check your connection.';return;}
const embed=/[?&]embed/.test(location.search);
if(embed)document.body.classList.add('embed');
if(!THREE.GLTFExporter)dl.hidden=true;

let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  if(embed)renderer.setClearColor(0x000000,0);
}
catch(e){stage.textContent='WebGL is not available in this browser.';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,0.1,100);
camera.position.set(0,0,11);
scene.add(new THREE.HemisphereLight(0xffffff,0x330008,0.75));
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(4,5,7);scene.add(key);
const rim=new THREE.DirectionalLight(0xff3040,1.3);rim.position.set(-6,-2,-5);scene.add(rim);
const fill=new THREE.PointLight(0xffd0d0,0.9,30);fill.position.set(-5,2,6);scene.add(fill);

/* ---------- geometry (traced from the logo; 500px image space -> world units) ---------- */
const D=Math.PI/180,CX=170,CY=240,RH=76,STEP=46.5;
const toW=(x,y)=>new THREE.Vector2((x-252)/100,-(y-223)/100);
const pol=(a,r)=>toW(CX+r*Math.cos(a*D),CY+r*Math.sin(a*D));
function edge(a0,aT,r0,p,rh,n){
  const pts=[];
  for(let i=0;i<=n;i++){const u=i/n;pts.push(pol(a0+(aT-a0)*u,rh+(r0-rh)*Math.pow(1-u,p)));}
  return pts;
}
const R=[171,173,166,158,150,142];
function blade(k){
  const s=-STEP*k,T=41+s,r=R[k];
  const o=edge(-55+s,T,r,2.2,RH+3,48);
  const i=edge(-75+s,T,r*0.866,3,RH,48).reverse();
  return new THREE.Shape(o.concat(i));
}
function ribbon(){
  const sp=pts=>new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],0))).getPoints(90).map(v=>toW(v.x,v.y));
  const top=sp([[92,248],[97,284],[126,312],[175,331],[225,329],[275,311],[325,277],[370,254],[415,247],[455,261],[490,297]]);
  const bot=sp([[488,300],[445,289],[405,288],[365,299],[330,320],[290,346],[245,362],[200,364],[155,353],[122,333],[108,312],[103,280],[97,252]]);
  return new THREE.Shape(top.concat(bot));
}

/* ---------- colour: black (lower left) to bright red (upper right) ---------- */
const stops=[[0,'#030000'],[.3,'#4a0408'],[.6,'#bf1219'],[.85,'#dc3a40'],[1,'#e8666a']].map(s=>[s[0],new THREE.Color(s[1])]);
const tmp=new THREE.Color();
function colorAt(x,y){
  const t=Math.min(1,Math.max(0,(x*.45+y*.55+1.4)/2.1));
  let i=1;while(i<stops.length-1&&t>stops[i][0])i++;
  const a=stops[i-1],b=stops[i];
  return tmp.copy(a[1]).lerp(b[1],(t-a[0])/(b[0]-a[0])).convertSRGBToLinear();
}
function paint(g){
  const p=g.attributes.position,c=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){const col=colorAt(p.getX(i),p.getY(i));c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;}
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
}

/* ---------- build model: 6 blades stacked in depth + ribbon on top ---------- */
const mat=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:0.3,metalness:0.2,clearcoat:1,clearcoatRoughness:0.12});
const opts={depth:.07,bevelEnabled:true,bevelThickness:.02,bevelSize:.018,bevelSegments:4,curveSegments:1};
const model=new THREE.Group();
model.name='citemas-logo';
function add(shape,z){
  const g=new THREE.ExtrudeGeometry(shape,opts);paint(g);
  const m=new THREE.Mesh(g,mat);m.position.z=z;model.add(m);
}
for(let k=0;k<6;k++)add(blade(k),(5-k)*.125);
add(ribbon(),6*.125);
model.position.z=-.42;
const rig=new THREE.Group();rig.add(model);scene.add(rig);

/* ---------- interaction: auto-spin 360, drag to rotate, page scroll still works ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=renderer.domElement;
let yaw=0.5,pitch=0.1,vel=0,drag=false,lx=0,ly=0,idle=0;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  vel=dx*0.012;yaw+=vel;pitch=Math.max(-0.6,Math.min(0.6,pitch+dy*0.008));idle=0;
});
const up=()=>{drag=false;};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);

function resize(){
  const w=stage.clientWidth||innerWidth,h=stage.clientHeight||innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  const t=Math.tan(camera.fov*D/2)*2;
  camera.position.z=Math.max(5.8/(t*camera.aspect),3.9/t);
  camera.updateProjectionMatrix();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
addEventListener('resize',resize);
addEventListener('load',resize);
setTimeout(resize,100);
setTimeout(resize,500);
resize();

const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(!drag){
    idle+=dt;
    if(Math.abs(vel)>0.0005){yaw+=vel;vel*=0.95;}
    else if(!reduce&&idle>1.2){yaw+=dt*0.7;}
    pitch+=(0.1-pitch)*0.02;
  }
  rig.rotation.y=yaw;
  rig.rotation.x=pitch;
  rig.position.y=reduce?0:Math.sin(t*1.2)*0.04;
  renderer.render(scene,camera);
})();

/* ---------- export the model as .glb ---------- */
dl.addEventListener('click',()=>{
  if(!THREE.GLTFExporter)return;
  new THREE.GLTFExporter().parse(model,res=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([res],{type:'model/gltf-binary'}));
    a.download='citemas-logo.glb';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },{binary:true});
});
})();
</script>
</body>
</html>
